<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tenant - SaaS Chatbot AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
        <div class="text-center mb-8">
            <span class="text-3xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                <i class="fa-solid fa-robot mr-2"></i>SaaS Chatbot
            </span>
            <h1 class="text-xl font-bold text-slate-950 mt-4">Registrasi Tenant Baru</h1>
            <p class="text-xs text-slate-400 mt-1">Daftar sekarang dan buat SDK Chatbot Anda sendiri</p>
        </div>

        {% if error %}
            <div class="bg-rose-50 border border-rose-200 text-rose-700 text-xs px-4 py-3 rounded-xl mb-6 flex items-center">
                <i class="fa-solid fa-triangle-exclamation mr-2"></i> {{ error }}
            </div>
        {% endif %}

        <form action="/register" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Nama Perusahaan / Organisasi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-building text-xs"></i>
                    </span>
                    <input type="text" name="name" required placeholder="PT Solusi Digital" class="w-full border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email Registrasi</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-envelope text-xs"></i>
                    </span>
                    <input type="email" name="email" required placeholder="ceo@solusidigital.com" class="w-full border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Password Baru</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" name="password" required placeholder="Maksimal keamanan ••••••••" class="w-full border border-slate-200 rounded-xl pl-9 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Pilih Paket SaaS</label>
                <select name="tier" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
                    <option value="Free">Paket FREE (1 Bot, 3 Doc, 100 chat/bln)</option>
                    <option value="Pro">Paket PRO (5 Bot, 20 Doc, 5.000 chat/bln)</option>
                    <option value="Enterprise">Paket ENTERPRISE (Custom, Unlimited)</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl text-sm font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-600/10">
                Registrasi Akun Tenant
            </button>
        </form>

        <div class="text-center mt-6 border-t border-slate-100 pt-6">
            <p class="text-xs text-slate-500">Sudah memiliki akun? <a href="/login" class="text-indigo-600 font-bold hover:underline">Masuk di sini</a></p>
        </div>
    </div>
</body>
</html>
